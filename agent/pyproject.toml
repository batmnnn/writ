[project]
name = "writ-agent"
version = "0.1.0"
description = "Writ research agent for AgentCore Runtime. It can only propose writs through Gateway tools."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bedrock-agentcore>=1.0",
  "strands-agents[anthropic]>=1.15,<2",
  "mcp>=1.12,<2",
  "boto3>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["writ_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
